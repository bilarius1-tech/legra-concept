<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ЛЕГРА — калькулятор лестниц. Все классы с префиксом lgc-. Фон прозрачный: работает поверх общего сплошного фона страницы. */
.lgc{
  --lgc-beige:#e3cfb2;--lgc-beige2:#c9b08e;--lgc-dim:rgba(227,207,178,.62);--lgc-line:rgba(227,207,178,.16);
  --lgc-red:#ca0f00;--lgc-red-hot:#e3261a;--lgc-ink:#0b0705;
  --lgc-serif:"Cormorant Garamond","Times New Roman",serif;--lgc-sans:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --lgc-ease:cubic-bezier(.7,0,.2,1);--lgc-out:cubic-bezier(.16,1,.3,1);
  position:relative;padding:140px 0 60px;color:var(--lgc-beige);font-family:var(--lgc-sans);font-size:16px;line-height:1.55;
  font-variant-numeric:lining-nums;
}
.lgc *,.lgc *::before,.lgc *::after{box-sizing:border-box}
:where(.lgc) button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:where(.lgc) img{display:block;max-width:100%}
.lgc-head,.lgc-grid{max-width:1400px;margin:0 auto;padding:0 clamp(20px,5vw,80px)}
.lgc-eyebrow{display:flex;align-items:center;gap:14px;font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--lgc-dim);font-weight:500;margin:0}
.lgc-line{display:inline-block;width:44px;height:1px;background:var(--lgc-red)}
.lgc-h2{font-family:var(--lgc-serif);font-weight:300;font-size:clamp(44px,7vw,112px);line-height:.95;letter-spacing:-.01em;margin:18px 0 0}
.lgc-h2 em{font-style:italic;color:var(--lgc-beige2)}
.lgc-lead{margin:18px 0 0;max-width:620px;color:var(--lgc-dim)}
.lgc-grid{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,.88fr);gap:clamp(28px,4vw,64px);margin-top:64px;align-items:start}

/* шаги */
.lgc-steps{display:flex;flex-direction:column;gap:46px}
.lgc-step__h{display:flex;align-items:baseline;gap:18px;margin-bottom:20px}
.lgc-step__n{font-family:var(--lgc-serif);font-style:italic;font-size:22px;color:var(--lgc-red-hot);min-width:30px}
.lgc-step__h h3{font-family:var(--lgc-serif);font-weight:400;font-size:clamp(26px,2.6vw,38px);line-height:1.1;margin:0}
.lgc-step__h h3 small{display:block;font-family:var(--lgc-sans);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--lgc-dim);margin-top:6px;font-weight:500}
.lgc-sub{font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--lgc-dim);margin:0 0 12px}

/* карточки типов */
.lgc-opts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.lgc-opts--f{grid-template-columns:repeat(3,1fr)}
.lgc-opt{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:12px;padding:20px 10px 16px;min-height:132px;text-align:center;border:1px solid var(--lgc-line);border-radius:3px;
  background:linear-gradient(180deg,rgba(255,235,210,.04),rgba(255,235,210,0));transition:border-color .5s,background .5s,transform .5s var(--lgc-out);overflow:hidden}
.lgc-opt svg{width:54px;height:54px;fill:none;stroke:var(--lgc-beige);stroke-width:1.15;stroke-linecap:round;stroke-linejoin:round;opacity:.8;transition:opacity .4s,transform .6s var(--lgc-out)}
.lgc-opt--f svg{width:76px;height:54px}
.lgc-opt svg .lgc-acc{stroke:var(--lgc-red-hot);stroke-width:1.5}
.lgc-opt svg .lgc-fill{fill:rgba(227,207,178,.14)}
.lgc-opt span{font-size:13px;line-height:1.25;color:var(--lgc-dim);transition:color .4s}
.lgc-opt:hover{border-color:rgba(227,207,178,.4);transform:translateY(-3px)}
.lgc-opt:hover svg{opacity:1;transform:scale(1.06)}
.lgc-opt.is-on{border-color:rgba(202,15,0,.7);background:linear-gradient(180deg,rgba(202,15,0,.16),rgba(255,235,210,.02))}
.lgc-opt.is-on span{color:var(--lgc-beige)}
.lgc-opt.is-on svg{opacity:1}
.lgc-opt.is-on::after{content:"";position:absolute;left:0;top:0;right:0;height:2px;background:var(--lgc-red)}

/* материалы */
.lgc-mats{display:grid;grid-template-columns:1fr;gap:26px}
.lgc-matrow{display:flex;flex-wrap:wrap;gap:10px}
.lgc-mat{display:flex;align-items:center;gap:10px;padding:6px 18px 6px 6px;border:1px solid var(--lgc-line);border-radius:999px;transition:border-color .4s,background .4s}
.lgc-mat img{width:40px;height:40px;border-radius:50%;object-fit:cover}
.lgc-mat span{font-size:14px;color:var(--lgc-dim);transition:color .3s}
.lgc-mat:hover{border-color:rgba(227,207,178,.45)}
.lgc-mat.is-on{border-color:var(--lgc-red);background:rgba(202,15,0,.14)}
.lgc-mat.is-on span{color:var(--lgc-beige)}

/* размеры */
.lgc-dims{display:grid;grid-template-columns:1fr 1fr;gap:26px 34px}
.lgc-dim{padding:18px 20px 12px;border:1px solid var(--lgc-line);border-radius:3px}
.lgc-dim__top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.lgc-dim__t{font-family:var(--lgc-serif);font-size:22px;line-height:1.1}
.lgc-dim__t em{display:block;font-family:var(--lgc-sans);font-style:normal;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--lgc-dim);margin-top:4px}
.lgc-num{display:flex;align-items:baseline;gap:6px;border-bottom:1px solid rgba(227,207,178,.4);padding-bottom:2px}
.lgc-num input{width:78px;background:none;border:0;outline:0;color:var(--lgc-beige);font-family:var(--lgc-serif);font-size:34px;line-height:1;text-align:right;-moz-appearance:textfield;appearance:textfield}
.lgc-num input::-webkit-outer-spin-button,.lgc-num input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.lgc-num i{font-style:normal;font-size:13px;color:var(--lgc-dim)}
.lgc-num:focus-within{border-color:var(--lgc-red)}
.lgc-dim input[type=range]{width:100%;height:28px;background:transparent;-webkit-appearance:none;appearance:none;cursor:pointer}
.lgc-dim input[type=range]::-webkit-slider-runnable-track{height:1px;background:rgba(227,207,178,.3)}
.lgc-dim input[type=range]::-moz-range-track{height:1px;background:rgba(227,207,178,.3)}
.lgc-dim input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--lgc-red);border:3px solid #1c110c;box-shadow:0 0 0 1px var(--lgc-red),0 6px 18px rgba(202,15,0,.5);margin-top:-10px;transition:transform .3s var(--lgc-out)}
.lgc-dim input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--lgc-red);border:3px solid #1c110c;box-shadow:0 0 0 1px var(--lgc-red)}
.lgc-dim input[type=range]:active::-webkit-slider-thumb{transform:scale(1.25)}
.lgc-dim__r{display:flex;justify-content:space-between;font-size:11px;color:var(--lgc-dim);letter-spacing:.1em}
.lgc-warn{margin:14px 0 0;padding:12px 16px;border-left:2px solid var(--lgc-red);background:rgba(202,15,0,.1);font-size:14px;color:var(--lgc-beige)}

/* балясины */
.lgc-balwrap{position:relative}
.lgc-balrow{-webkit-mask-image:linear-gradient(90deg,#000 92%,transparent);mask-image:linear-gradient(90deg,#000 92%,transparent);display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x proximity;padding:4px 2px 14px;scrollbar-width:thin;scrollbar-color:rgba(227,207,178,.3) transparent;outline:none}
.lgc-balrow::-webkit-scrollbar{height:4px}.lgc-balrow::-webkit-scrollbar-thumb{background:rgba(227,207,178,.3);border-radius:4px}
.lgc-bal{flex:none;width:128px;scroll-snap-align:start;display:flex;flex-direction:column;gap:2px;text-align:left;padding:8px 8px 12px;border:1px solid var(--lgc-line);border-radius:3px;transition:border-color .4s,background .4s,transform .5s var(--lgc-out)}
.lgc-bal__img{display:block;height:150px;background:var(--lgc-beige);border-radius:2px;overflow:hidden;margin-bottom:10px}
.lgc-bal__img img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply;transition:transform .8s var(--lgc-out)}
.lgc-bal b{font-weight:600;font-size:13px;line-height:1.2;color:var(--lgc-beige)}
.lgc-bal i{font-style:normal;font-size:12px;color:var(--lgc-dim)}
.lgc-bal:hover{transform:translateY(-3px);border-color:rgba(227,207,178,.4)}
.lgc-bal:hover img{transform:scale(1.08)}
.lgc-bal.is-on{border-color:var(--lgc-red);background:rgba(202,15,0,.14)}
.lgc-bal.is-on i{color:var(--lgc-red-hot)}
.lgc-bal--none{justify-content:center;align-items:flex-start;padding:14px}
.lgc-bal__x{font-family:var(--lgc-serif);font-size:54px;line-height:1;color:var(--lgc-beige2);margin-bottom:auto}
.lgc-bal--none i{margin-top:6px;font-size:11px;line-height:1.3}
.lgc-balnav{display:flex;gap:8px;margin-top:4px}
.lgc-arr{width:44px;height:44px;border-radius:50%;border:1px solid rgba(227,207,178,.35);font-size:22px;line-height:1;transition:background .3s,border-color .3s}
.lgc-arr:hover{background:var(--lgc-red);border-color:var(--lgc-red)}
.lgc-qty{display:flex;align-items:center;flex-wrap:wrap;gap:14px 20px;margin-top:18px;padding-top:18px;border-top:1px solid var(--lgc-line)}
.lgc-qty>span{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--lgc-dim)}
.lgc-qty[hidden]{display:none}
.lgc-stepper{display:flex;align-items:center;border:1px solid rgba(227,207,178,.35);border-radius:999px;overflow:hidden}
.lgc-stepper button{width:46px;height:46px;font-size:22px;transition:background .3s}
.lgc-stepper button:hover{background:var(--lgc-red)}
.lgc-stepper input{width:64px;height:46px;background:none;border:0;outline:0;text-align:center;color:var(--lgc-beige);font-family:var(--lgc-serif);font-size:24px;-moz-appearance:textfield;appearance:textfield}
.lgc-stepper input::-webkit-outer-spin-button,.lgc-stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.lgc-hint{font-style:normal;font-size:12px;color:var(--lgc-dim)}

/* правая колонка */
.lgc-side{position:sticky;top:84px}
.lgc-card{max-height:calc(100svh - 104px);overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:rgba(227,207,178,.25) transparent;border:1px solid var(--lgc-line);border-radius:4px;padding:18px;background:linear-gradient(160deg,rgba(255,235,210,.06),rgba(255,235,210,.015));backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);scroll-margin-top:80px}
.lgc-scheme{position:relative;border:1px solid var(--lgc-line);border-radius:3px;background:radial-gradient(90% 80% at 50% 40%,rgba(255,235,210,.05),rgba(0,0,0,.15));overflow:hidden}
.lgc-scheme svg{display:block;width:100%;height:auto}
.lgc-tag{position:absolute;left:12px;top:10px;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--lgc-dim)}
.lgc-sg .lgc-ln{fill:none;stroke:var(--lgc-beige);stroke-width:1.1;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.lgc-sg .lgc-ln--dim{opacity:.4}
.lgc-sg .lgc-fill{fill:rgba(227,207,178,.09)}
.lgc-sg .lgc-dot{fill:var(--lgc-beige);opacity:.85}
.lgc-sg .lgc-tread{stroke:rgba(11,7,5,.35);stroke-width:.6}
.lgc-sg .lgc-tread--p{stroke:rgba(11,7,5,.6);stroke-width:1}
.lgc-sg .lgc-bl{opacity:.55;stroke-width:.9}.lgc-sg .lgc-bl--bold{stroke-width:2;opacity:.7}
.lgc-sg .lgc-bl--post{stroke-width:2.2;opacity:.8}
.lgc-sg .lgc-ring{stroke-width:.9;opacity:.6}
.lgc-sg .lgc-glass{fill:rgba(150,205,225,.1);stroke:rgba(190,225,235,.55);stroke-width:1}
.lgc-sg .lgc-newel{stroke-width:2.2;opacity:1}
.lgc-sg .lgc-hand{stroke-width:2.6;stroke:var(--lgc-beige);opacity:1}
.lgc-sg .lgc-dimln{fill:none;stroke:var(--lgc-red-hot);stroke-width:1.1}
.lgc-sg .lgc-dtx{fill:var(--lgc-beige);font:500 13px var(--lgc-sans);letter-spacing:.04em}
.lgc-sg .lgc-dtx--s{font-size:11.5px;fill:var(--lgc-red-hot);stroke:#150c08;stroke-width:4px;paint-order:stroke;stroke-linejoin:round}
.lgc-sg.lgc-in .lgc-tread{animation:lgcGrow .7s var(--lgc-out) both;transform-box:fill-box;transform-origin:left bottom}
.lgc-sg.lgc-in .lgc-railing,.lgc-sg.lgc-in .lgc-hand{animation:lgcFade .9s .25s var(--lgc-out) both}
@keyframes lgcGrow{from{opacity:0;transform:translateY(10px) scaleX(.3)}to{opacity:1;transform:none}}
@keyframes lgcFade{from{opacity:0}to{opacity:1}}
.lgc-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin:12px 0 0;background:var(--lgc-line);border:1px solid var(--lgc-line);border-radius:3px;overflow:hidden}
.lgc-m{display:flex;flex-direction:column;gap:2px;padding:10px 10px 8px;background:#150c08}
.lgc-m span{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--lgc-dim);line-height:1.25;min-height:2.5em}
.lgc-m b{font-family:var(--lgc-serif);font-weight:500;font-size:22px;line-height:1.05;white-space:nowrap}
.lgc-m i{font-style:normal;font-size:11px;color:var(--lgc-beige2)}
.lgc-m i.is-bad{color:var(--lgc-red-hot)}
.lgc-chosen{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.lgc-chosen li{display:inline-flex;gap:6px;padding:5px 11px;border:1px solid var(--lgc-line);border-radius:999px;font-size:12px;line-height:1.3}
.lgc-chosen span{color:var(--lgc-dim)}
.lgc-chosen b{font-weight:500}
.lgc-total{margin-top:18px}
.lgc-total__label{font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--lgc-dim);margin:0}
.lgc-total__num{display:flex;align-items:baseline;gap:12px;margin:6px 0 10px;font-family:var(--lgc-serif);line-height:1}
.lgc-total__num b{font-weight:300;font-size:clamp(44px,4.6vw,66px);letter-spacing:-.01em;white-space:nowrap}
.lgc-total__num.is-empty b{font-style:italic;font-size:clamp(38px,4.2vw,56px);color:var(--lgc-beige2)}
.lgc-from{font-style:italic;font-size:26px;color:var(--lgc-red-hot)}
.lgc-from[hidden]{display:none}
.lgc-break{border-top:1px solid var(--lgc-line)}
.lgc-row{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:11px 0;border-bottom:1px solid var(--lgc-line);font-size:14px}
.lgc-row small{display:block;font-size:12px;color:var(--lgc-dim)}
.lgc-row b{font-weight:600;white-space:nowrap}
.lgc-row.is-pending b{font-weight:400;font-style:italic;font-family:var(--lgc-serif);font-size:17px;color:var(--lgc-beige2)}
.lgc-note{margin:14px 0 0;font-size:13px;color:var(--lgc-dim);padding-left:14px;border-left:2px solid var(--lgc-red)}
.lgc-cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.lgc-cta[hidden]{display:none}

/* кнопки и форма */
.lgc-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;flex:1 1 170px;height:56px;padding:0 24px;border-radius:999px;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;overflow:hidden;isolation:isolate;text-decoration:none;white-space:nowrap;transition:color .4s var(--lgc-ease),border-color .4s}
.lgc-btn svg{width:18px;height:18px;fill:currentColor}
.lgc-btn::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;background:var(--lgc-beige);transform:translateY(101%);transition:transform .55s var(--lgc-ease)}
.lgc-btn:hover::before{transform:none}
.lgc-btn--red{background:var(--lgc-red);color:#fff;box-shadow:0 10px 40px -10px rgba(202,15,0,.7)}
.lgc-btn--red:hover{color:var(--lgc-ink)}
.lgc-btn--ghost{border:1px solid rgba(227,207,178,.4);color:var(--lgc-beige)}
.lgc-btn--ghost:hover{color:var(--lgc-ink);border-color:var(--lgc-beige)}
.lgc-btn--block{width:100%;flex:none}
.lgc-form{margin-top:18px}
.lgc-form[hidden]{display:none}
.lgc-form.is-in .lgc-form__in{animation:lgcUp .7s var(--lgc-out) both}
.lgc-form__in{display:flex;flex-direction:column;gap:14px;padding-top:18px;border-top:1px solid var(--lgc-line)}
@keyframes lgcUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.lgc-field{display:flex;flex-direction:column;gap:6px}
.lgc-field span{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--lgc-dim)}
.lgc-field input{height:52px;padding:0 16px;background:rgba(11,7,5,.4);border:1px solid var(--lgc-line);border-radius:3px;color:var(--lgc-beige);font:inherit;font-size:16px;outline:0;transition:border-color .3s}
.lgc-field input::placeholder{color:rgba(227,207,178,.35)}
.lgc-field input:focus{border-color:var(--lgc-red)}
.lgc-check{display:flex;gap:12px;align-items:flex-start;cursor:pointer;font-size:13px;color:var(--lgc-dim);line-height:1.4}
.lgc-check input{position:absolute;opacity:0;width:0;height:0}
.lgc-check i{flex:none;width:20px;height:20px;border:1px solid rgba(227,207,178,.5);border-radius:3px;margin-top:1px;position:relative;transition:background .3s,border-color .3s}
.lgc-check input:checked+i{background:var(--lgc-red);border-color:var(--lgc-red)}
.lgc-check input:checked+i::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.lgc-check input:focus-visible+i{outline:2px solid var(--lgc-beige);outline-offset:2px}
.lgc-err{margin:0;font-size:13px;color:var(--lgc-red-hot)}
.lgc-err[hidden]{display:none}
.lgc-ok{text-align:center;padding:30px 10px 10px}
.lgc-ok[hidden]{display:none}
.lgc-ok.is-in{animation:lgcUp .8s var(--lgc-out) both}
.lgc-ok__mark{width:64px;height:64px;margin:0 auto 18px;border-radius:50%;border:1px solid var(--lgc-red);display:grid;place-items:center}
.lgc-ok__mark svg{width:30px;height:30px;fill:none;stroke:var(--lgc-red-hot);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:30;stroke-dashoffset:30}
.lgc-ok.is-in .lgc-ok__mark svg{animation:lgcDraw .8s .2s var(--lgc-ease) forwards}
@keyframes lgcDraw{to{stroke-dashoffset:0}}
.lgc-ok__t{font-family:var(--lgc-serif);font-size:30px;line-height:1.1;margin:0}
.lgc-ok__s{margin:10px 0 0;color:var(--lgc-dim)}
.lgc-ok__demo{margin:16px 0 0;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(227,207,178,.4)}

/* мини-панель на мобильном */
.lgc-bar{display:none}
@media (max-width:980px){
  .lgc{padding-top:100px}
  .lgc-grid{grid-template-columns:minmax(0,1fr);margin-top:40px}
  .lgc-side{position:static}
  .lgc-card{max-height:none;overflow:visible}
  .lgc-bar{display:flex;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:80;align-items:center;justify-content:space-between;gap:12px;padding:10px 10px 10px 18px;border:1px solid rgba(227,207,178,.25);border-radius:999px;background:rgba(18,10,7,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-size:13px;box-shadow:0 20px 50px -10px rgba(0,0,0,.7);opacity:0;transform:translateY(24px);pointer-events:none;transition:opacity .5s,transform .6s var(--lgc-out)}
  .lgc-bar.is-on{opacity:1;transform:none;pointer-events:auto}
  .lgc-bar__go{flex:none;padding:10px 16px;border-radius:999px;background:var(--lgc-red);color:#fff;font-weight:600;font-size:12px;letter-spacing:.1em;text-transform:uppercase;text-decoration:none}
}

<script>
/* ЛЕГРА — калькулятор лестниц. Самодостаточный модуль: нужен только calc-config.js и контейнер
   <section class="lgc" id="calc"></section>. Классы и переменные с префиксом lgc-. Без библиотек. */
(function () {
  'use strict';
  var root = document.getElementById('calc');
  var C = window.LEGRA_CALC_CONFIG;
  if (!root || !C) return;
  var RM = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var P = C.prices, G = C.geometry;
  var $ = function (s, r) { return (r || root).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || root).querySelectorAll(s)); };
  var nf = new Intl.NumberFormat('ru-RU');
  var money = function (v) { return nf.format(Math.round(v)).replace(/\u00a0|\u202f/g, '\u00a0') + '\u00a0₽'; };
  var byId = function (arr, id) { for (var i = 0; i < arr.length; i++) if (arr[i].id === id) return arr[i]; return arr[0]; };
  var clamp = function (v, a, b) { return Math.max(a, Math.min(b, v)); };

  /* ---------------- состояние ---------------- */
  var S = { type: C.types[0].id, found: C.foundations[0].id, stepMat: C.stepMaterials[0].id, railMat: C.railingMaterials[0].id,
            h: G.heightCm.def, w: G.widthCm.def, bal: null, qty: 0, qtyManual: false };
  var lastKey = '';

  /* ---------------- геометрия ---------------- */
  function geometry() {
    var Hmm = S.h * 10, n = Math.max(1, Math.round(Hmm / G.riserTargetMm));
    if (Hmm / n > G.riserMaxMm) n++;
    if (Hmm / n < G.riserMinMm && n > 1) n--;
    var riser = Hmm / n, t = byId(C.types, S.type), landings = t.landings;
    var treads = Math.max(0, n - 1 - landings);
    var ok = riser >= G.riserMinMm - 0.5 && riser <= G.riserMaxMm + 0.5;
    var blondel = 2 * riser + G.treadMm;                       // формула удобства шага: 600–640 мм
    return { n: n, riser: riser, angle: Math.atan(riser / G.treadMm) * 180 / Math.PI, treads: treads,
             run: treads * G.treadMm / 1000, ok: ok, comfy: blondel >= 600 && blondel <= 640, landings: landings };
  }

  /* ---------------- расчёт стоимости ---------------- */
  function estimate(g) {
    var lines = [], total = 0, pending = false;
    var sp = P.stepPerPiece[S.stepMat], rp = P.railingPerMeter[S.railMat];
    var f = (typeof P.typeFactor[S.type] === 'number' ? P.typeFactor[S.type] : 1) *
            (typeof P.foundationFactor[S.found] === 'number' ? P.foundationFactor[S.found] : 1);
    if (typeof sp === 'number') {
      var v = g.n * sp * f; total += v;
      lines.push({ label: 'Ступени · ' + byId(C.stepMaterials, S.stepMat).title, sub: g.n + ' шт × ' + money(sp * f), amount: v });
    } else { pending = true; lines.push({ label: 'Ступени · ' + byId(C.stepMaterials, S.stepMat).title, sub: g.n + ' шт', amount: null }); }
    if (typeof rp === 'number') {
      var len = (g.treads * G.treadMm / 1000) + 0.9 * g.landings, vr = len * rp; total += vr;
      lines.push({ label: 'Ограждение · ' + byId(C.railingMaterials, S.railMat).title, sub: len.toFixed(1).replace('.', ',') + ' м × ' + money(rp), amount: vr });
    } else { pending = true; lines.push({ label: 'Ограждение · ' + byId(C.railingMaterials, S.railMat).title, sub: 'по проекту', amount: null }); }
    if (S.bal) {
      var bp = P.balusters[S.bal], name = nameOf(S.bal);
      if (typeof bp === 'number') { var vb = bp * S.qty; total += vb; lines.push({ label: 'Балясины · ' + name, sub: S.qty + ' шт × ' + money(bp), amount: vb }); }
      else { pending = true; lines.push({ label: 'Балясины · ' + name, sub: S.qty + ' шт', amount: null, note: 'цена по запросу' }); }
    }
    return { lines: lines, total: total, pending: pending, any: lines.some(function (l) { return l.amount !== null; }) };
  }
  function nameOf(id) { for (var i = 0; i < C.balusterCatalog.length; i++) if (C.balusterCatalog[i][0] === id) return C.balusterCatalog[i][1]; return id; }

  /* ---------------- иконки (план) ---------------- */
  var ln = function (x1, y1, x2, y2, c) { return '<path d="M' + x1 + ' ' + y1 + 'L' + x2 + ' ' + y2 + '"' + (c ? ' class="' + c + '"' : '') + '/>'; };
  var rc = function (x, y, w, h) { return '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '"/>'; };
  function hatchV(x1, x2, y1, y2, n) { var s = ''; for (var i = 1; i < n; i++) { var y = y1 + (y2 - y1) * i / n; s += ln(x1, y, x2, y); } return s; }
  function hatchH(x1, x2, y1, y2, n) { var s = ''; for (var i = 1; i < n; i++) { var x = x1 + (x2 - x1) * i / n; s += ln(x, y1, x, y2); } return s; }
  function radial(cx, cy, r0, r1, n, a0, a1) { var s = ''; for (var i = 0; i <= n; i++) { var a = (a0 + (a1 - a0) * i / n) * Math.PI / 180; s += ln((cx + r0 * Math.cos(a)).toFixed(1), (cy + r0 * Math.sin(a)).toFixed(1), (cx + r1 * Math.cos(a)).toFixed(1), (cy + r1 * Math.sin(a)).toFixed(1)); } return s; }
  var arrowUp = function (x, y1, y2) { return '<path class="lgc-acc" d="M' + x + ' ' + y1 + 'V' + y2 + 'M' + (x - 3) + ' ' + (y2 + 4) + 'L' + x + ' ' + y2 + 'L' + (x + 3) + ' ' + (y2 + 4) + '"/>'; };
  var TYPE_ICON = {
    straight: function () { return rc(16, 6, 16, 36) + hatchV(16, 32, 6, 42, 9) + arrowUp(24, 39, 10); },
    land_l: function () { return rc(8, 26, 14, 16) + hatchV(8, 22, 26, 42, 5) + rc(8, 10, 14, 16) + rc(22, 10, 18, 16) + hatchH(22, 40, 10, 26, 6) + '<path class="lgc-acc" d="M15 40V18H37M34 15L37 18L34 21"/>'; },
    wind_l: function () { return rc(8, 28, 14, 14) + hatchV(8, 22, 28, 42, 4) + rc(8, 12, 14, 16) + ln(22, 28, 8, 22) + ln(22, 28, 8, 17) + ln(22, 28, 11, 12) + ln(22, 28, 16, 12) + rc(22, 12, 18, 16) + hatchH(22, 40, 12, 28, 6) + '<path class="lgc-acc" d="M15 40V25Q15 20 22 20H37M34 17L37 20L34 23"/>'; },
    spiral: function () { return '<circle cx="24" cy="24" r="17"/><circle cx="24" cy="24" r="3"/>' + radial(24, 24, 3, 17, 11, 0, 330) + '<path class="lgc-acc" d="M24 33A9 9 0 1 1 33 24M30 22L33 24L35 21"/>'; },
    wind_u: function () { return rc(8, 24, 10, 18) + hatchV(8, 18, 24, 42, 5) + rc(30, 24, 10, 18) + hatchV(30, 40, 24, 42, 5) + '<path d="M8 24A16 16 0 0 1 40 24"/>' + radial(24, 24, 0, 16, 5, 180, 360) + '<path class="lgc-acc" d="M13 40V24A11 11 0 0 1 35 24V38M32 35L35 38L38 35"/>'; },
    land_u: function () { return rc(8, 26, 10, 16) + hatchV(8, 18, 26, 42, 4) + rc(30, 26, 10, 16) + hatchV(30, 40, 26, 42, 4) + rc(8, 8, 32, 18) + '<path class="lgc-acc" d="M13 40V17H35V38M32 35L35 38L38 35"/>'; },
    shaft: function () { return rc(6, 6, 36, 36) + '<circle cx="24" cy="24" r="14"/><circle cx="24" cy="24" r="2.5"/>' + radial(24, 24, 2.5, 14, 11, 0, 330); },
    three: function () { return rc(8, 26, 10, 16) + hatchV(8, 18, 26, 42, 4) + rc(8, 8, 10, 18) + rc(18, 8, 16, 10) + hatchH(18, 34, 8, 18, 5) + rc(34, 8, 8, 12) + rc(34, 20, 8, 22) + hatchV(34, 42, 20, 42, 5) + '<path class="lgc-acc" d="M13 40V13H38V38M35 35L38 38L41 35"/>'; }
  };
  var treadsPts = function (n, dx, dy) { var a = []; for (var i = 0; i < n; i++) a.push([4 + i * dx, 27 - i * dy]); return a; };
  var FOUND_ICON = {
    kosour: function () { var p = treadsPts(6, 9, 4), s = ''; p.forEach(function (q) { s += ln(q[0], q[1], q[0] + 9, q[1]) + ln(q[0], q[1], q[0], q[1] + 4); }); return s + '<path d="M4 29L49 9L49 14L4 33Z" class="lgc-fill"/>'; },
    tetiva: function () { var p = treadsPts(6, 9, 4), d = 'M4 28', s = ''; p.forEach(function (q) { d += 'L' + q[0] + ' ' + q[1] + 'L' + (q[0] + 9) + ' ' + q[1]; }); var d2 = ''; p.slice().reverse().forEach(function (q) { d2 += 'L' + (q[0] + 9) + ' ' + (q[1] - 5) + 'L' + q[0] + ' ' + (q[1] - 5); }); return '<path class="lgc-fill" d="' + d + d2 + 'Z"/>'; },
    bolts: function () { var p = treadsPts(6, 9, 4), s = ''; p.forEach(function (q) { s += ln(q[0], q[1], q[0] + 9, q[1]) + '<circle cx="' + (q[0] + 7) + '" cy="' + (q[1] + 4) + '" r="1.8"/>' + ln(q[0] + 7, q[1], q[0] + 7, q[1] + 2.2); }); return s; },
    spiral: function () { return '<circle cx="28" cy="16" r="12"/><circle cx="28" cy="16" r="2"/>' + radial(28, 16, 2, 12, 9, 0, 320); },
    single: function () { var p = treadsPts(6, 9, 4), s = ''; p.forEach(function (q) { s += ln(q[0] - 1, q[1], q[0] + 10, q[1]); }); return s + '<path class="lgc-fill" d="M4 31L49 11L49 19L4 38Z"/>'; },
    metal: function () { var p = treadsPts(6, 9, 4), s = ''; p.forEach(function (q) { s += ln(q[0], q[1], q[0] + 9, q[1]); }); s += '<path class="lgc-fill" d="M4 30L49 10L49 17L4 37Z"/>'; for (var i = 0; i < 7; i++) s += ln(4 + i * 7.5, 31 - i * 3.3 + (i % 2 ? 6 : 0), 11.5 + i * 7.5, 31 - (i + 1) * 3.3 + (i % 2 ? 0 : 6)); return s; }
  };

  /* ---------------- разметка ---------------- */
  function build() {
    var typeCards = C.types.map(function (t) {

    $$('[data-k]').forEach(function (el) {
      var k = el.dataset.k, v = el.dataset.v, on = k === 'bal' ? (S.bal || '') === v : S[k] === v;
      el.setAttribute('aria-pressed', on ? 'true' : 'false'); el.classList.toggle('is-on', on);
    });
    // метрики
    var mt = [['Ступеней', String(g.n), ''], ['Высота ступени', Math.round(g.riser) + ' мм', g.ok ? (g.comfy ? 'удобно' : 'в норме') : 'вне нормы'], ['Угол подъёма', Math.round(g.angle) + '°', ''], ['Глубина ступени', G.treadMm + ' мм', '']];
    $('.lgc-metrics').innerHTML = mt.map(function (m) { return '<div class="lgc-m"><span>' + m[0] + '</span><b>' + m[1] + '</b>' + (m[2] ? '<i class="' + (g.ok ? '' : 'is-bad') + '">' + m[2] + '</i>' : '') + '</div>'; }).join('');
    var warn = $('.lgc-warn');
    warn.hidden = g.ok;
    if (!g.ok) warn.textContent = 'При такой высоте высота ступени получается ' + Math.round(g.riser) + ' мм — вне нормы 150–200 мм. Мастер подберёт решение на замере.';
    // выбранное
    var t = byId(C.types, S.type), fd = byId(C.foundations, S.found);
    var chosen = [['Тип', t.title], ['Основание', fd.title], ['Ступени', byId(C.stepMaterials, S.stepMat).title], ['Перила', byId(C.railingMaterials, S.railMat).title], ['Высота', S.h + ' см'], ['Ширина', S.w + ' см']];
    $('.lgc-chosen').innerHTML = chosen.map(function (c) { return '<li><span>' + c[0] + '</span><b>' + c[1] + '</b></li>'; }).join('');
    // количество балясин
    var q = $('.lgc-qty'); q.hidden = !S.bal;
    if (S.bal) { var qi = $('input', q); if (document.activeElement !== qi) qi.value = S.qty; $('.lgc-hint', q).textContent = S.qtyManual ? 'Количество задано вручную' : 'Предложено: ' + C.balustersPerStep + ' на ступень · можно изменить'; }
    // стоимость
    var e = estimate(g);
    tweenNum($('.lgc-total__num b'), e.total, money);
    $('.lgc-total__num').classList.toggle('is-empty', !e.any);
    $('.lgc-total__label').textContent = e.any ? 'Итого по прайсу' : 'Стоимость лестницы';
    $('.lgc-from').hidden = !e.any;
    if (!e.any) $('.lgc-total__num b').textContent = 'по замеру';
    $('.lgc-break').innerHTML = e.lines.map(function (l) {
      return '<div class="lgc-row' + (l.amount === null ? ' is-pending' : '') + '"><div><span>' + l.label + '</span><small>' + l.sub + '</small></div><b>' + (l.amount === null ? (l.note || 'по замеру') : money(l.amount)) + '</b></div>';
    }).join('');
    $('.lgc-bar__t').textContent = g.n + ' ступ. · ' + Math.round(g.riser) + ' мм · ' + (e.any ? 'от ' + money(e.total) : 'цена по замеру');
  }

  /* ---------------- события ---------------- */
  function bind() {
    root.addEventListener('click', function (ev) {
      var b = ev.target.closest('[data-k]');
      if (b) {
        var k = b.dataset.k, v = b.dataset.v;
        if (k === 'bal') { S.bal = v || null; if (S.bal && !S.qtyManual) S.qty = geometry().n * C.balustersPerStep; }
        else S[k] = v;
        sync(); return;
      }
      var arr = ev.target.closest('.lgc-arr');
      if (arr) { var row = $('.lgc-balrow'); row.scrollBy({ left: +arr.dataset.dir * row.clientWidth * 0.8, behavior: RM ? 'auto' : 'smooth' }); return; }
      var qb = ev.target.closest('[data-q]');
      if (qb) { S.qty = clamp(S.qty + +qb.dataset.q, 1, 999); S.qtyManual = true; sync(); return; }
      if (ev.target.closest('.lgc-send')) { var f = $('.lgc-form'), btn = $('.lgc-send'), open = f.hidden; f.hidden = !open; btn.setAttribute('aria-expanded', open); btn.textContent = open ? 'Скрыть форму' : 'Отправить расчёт'; if (open) { f.classList.remove('is-in'); void f.offsetWidth; f.classList.add('is-in'); setTimeout(function () { $('input[name=name]', f).focus({ preventScroll: true }); }, 50); } return; }
    });
    // размеры
    $$('.lgc-dim').forEach(function (box) {
      var k = box.dataset.dim, r = k === 'h' ? G.heightCm : G.widthCm, rng = $('input[type=range]', box), num = $('input[type=number]', box);
      var set = function (v, fromNum) { v = Math.round(+v); if (isNaN(v)) return; S[k] = clamp(v, r.min, r.max); rng.value = S[k]; if (!fromNum || clamp(v, r.min, r.max) === v) num.value = S[k]; sync(); };
      rng.addEventListener('input', function () { set(rng.value); });
      num.addEventListener('input', function () { if (num.value !== '' && +num.value >= r.min) set(num.value, true); });
      num.addEventListener('blur', function () { num.value = S[k]; });
    });
    var qi = $('.lgc-qty input');
    qi.addEventListener('input', function () { var v = Math.round(+qi.value); if (v >= 1) { S.qty = clamp(v, 1, 999); S.qtyManual = true; sync(); } });
    // форма (демо)
    var form = $('.lgc-form'), err = $('.lgc-err');
    var ph = $('input[name=phone]', form);
    ph.addEventListener('input', function () {
      var d = ph.value.replace(/\D/g, ''); if (d[0] === '8' || d[0] === '7') d = d.slice(1); d = d.slice(0, 10);
      var o = '+7'; if (d.length) o += ' (' + d.slice(0, 3); if (d.length >= 3) o += ')'; if (d.length > 3) o += ' ' + d.slice(3, 6); if (d.length > 6) o += '-' + d.slice(6, 8); if (d.length > 8) o += '-' + d.slice(8, 10);
      ph.value = d.length ? o : '';
    });
    form.addEventListener('submit', function (ev) {
      ev.preventDefault();
      var name = form.name.value.trim(), digits = ph.value.replace(/\D/g, '');
      var msg = !name ? 'Введите ваше имя' : digits.length < 11 ? 'Введите телефон полностью' : !form.agree.checked ? 'Нужно согласие на обработку данных' : '';
      err.hidden = !msg; err.textContent = msg;
      if (msg) return;
      /* ДЕМО: ничего не отправляем. В Тильде здесь подключается форма заявок Тильды (см. README). */
      form.hidden = true; $('.lgc-cta').hidden = true; var ok = $('.lgc-ok'); ok.hidden = false; ok.classList.add('is-in');
    });
    // мини-панель на мобильном: показываем, пока калькулятор на экране, но итог ещё не виден
    var bar = $('.lgc-bar'), vis = { sec: false, card: false };
    var upd = function () { bar.classList.toggle('is-on', vis.sec && !vis.card); };
    if ('IntersectionObserver' in window) {
      new IntersectionObserver(function (en) { vis.sec = en[0].isIntersecting; upd(); }, { threshold: 0.05 }).observe(root.querySelector('.lgc-grid'));
      new IntersectionObserver(function (en) { vis.card = en[0].isIntersecting; upd(); }, { threshold: 0.2 }).observe($('.lgc-card'));
    }
    $('.lgc-bar__go').addEventListener('click', function (ev) { ev.preventDefault(); var c = $('.lgc-card'); window.scrollTo({ top: c.getBoundingClientRect().top + scrollY - 70, behavior: RM ? 'auto' : 'smooth' }); });
    // появление блоков при скролле
    if ('IntersectionObserver' in window && !RM) {
      var io = new IntersectionObserver(function (en) { en.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('is-seen'); io.unobserve(e.target); } }); }, { threshold: 0.12 });
      $$('.lgc-step, .lgc-head, .lgc-card').forEach(function (el) { el.classList.add('lgc-rv'); io.observe(el); });
    }
  }

  build(); bind(); sync();
})();

</script>
